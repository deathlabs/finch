<form hx-post="/next" hx-target="#main-content" hx-swap="innerHTML">
  {{template "stepper-buttons.html" .}}

  <div id="components-container">
    {{ template "oscal-component-form.html" .InitialBlock }}
  </div>

  <button type="button" 
    hx-get="/components/new-block" 
    hx-target="#components-container" 
    hx-swap="beforeend"
    hx-vals='js:{index: document.querySelectorAll(".component-block").length}'>
    + Create Another OSCAL Component
  </button>
</form>
