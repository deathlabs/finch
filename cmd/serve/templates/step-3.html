<form method="post" action="/export">
  <fieldset role="group">
    <button type="button" class="secondary" hx-post="/back" hx-target="#main-content" hx-swap="innerHTML"{{if eq .CurrentStep 1}} disabled{{end}}>
      Back
    </button>
    <button type="submit">
      Export
    </button>
  </fieldset>

  {{range $index, $component := .Components}}
    <details {{if eq $index 0}}open{{end}}>
      <summary>{{$component.Title}}</summary>

      {{range $tool, $rules := $.AvailableRulesByTool}}
        <fieldset>
          <legend>{{$tool}}</legend>
          {{range $rules}}
            <label>
              <input type="checkbox" name="component_rules_{{$index}}_{{$tool}}" value="{{.}}">
              <code>{{.}}</code>
            </label>
          {{end}}
        </fieldset>
      {{else}}
        <p><small>No security rules available.</small></p>
      {{end}}
    </details>
  {{else}}
    <p><small>No components created in the previous step.</small></p>
  {{end}}
</form>
