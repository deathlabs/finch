[project]
site_name = "Finch"
repo_url = "https://github.com/deathlabs/finch"
docs_dir = "content"
site_dir = "public"
use_directory_urls = true
nav = [
  { Home = "index.md" },
  { "User Guide" = [
    "user-guide/index.md",
    { "Getting Started" = "user-guide/getting-started.md" },
    { "Creating a Mappings File" = "user-guide/creating-a-mappings-file.md" },
    { "Proposing a Component" = "user-guide/proposing-a-component.md" },
    { "Proposing a New Control-to-Component Mapping" = "user-guide/proposing-a-new-control-to-component-mapping.md" },
    { "Proposing a New Rule-to-Component Mapping" = "user-guide/proposing-a-new-rule-to-component-mapping.md" },
    { "Viewing Entries" = "user-guide/viewing-entries.md" },
    { "Deleting Entries" = "user-guide/deleting-entries.md" },
    { "Mappings File Schema" = "user-guide/mappings-file-schema.md" },
    { "Generating a New Suppression" = "user-guide/generating-a-new-suppression.md" },
  ] },
  { "Developer Guide" = [
    "developer-guide/index.md",
    { "Getting Started" = "developer-guide/getting-started.md" },
    { "Update the JSON Schema" = "developer-guide/update-the-json-schema.md" },
    { "Preview and Build the Docs" = "developer-guide/preview-and-build-the-docs.md" },
  ] },
  { Glossary = "GLOSSARY.md" },
]

[project.markdown_extensions.toc]
permalink = false

[project.theme]
variant = "modern"
features = ["navigation.indexes"]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
