[package]
name = "finch"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.27", default-features = false }
rusty-bubbletea = "2.0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
unicode-width = "0.1"
uuid = { version = "1.29.3", features = ["v4"] }
walkdir = "2.5.1"
